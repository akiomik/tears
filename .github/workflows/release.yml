name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Read the pin for the release assertion. The setup action installs the
      # toolchain directly from rust-toolchain.toml.
      - id: versions
        name: Read the pinned channel
        run: |
          pinned=$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$pinned" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$pinned" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - name: Verify the toolchain
        run: |
          active=$(rustup show active-toolchain)
          echo "$active"
          [[ $active == "${RUSTUP_TOOLCHAIN}-"* ]] \
            || { echo "active toolchain is not the pin ${RUSTUP_TOOLCHAIN}" >&2; exit 1; }
      - uses: Swatinem/rust-cache@v2

      - name: Check package
        run: cargo publish --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
