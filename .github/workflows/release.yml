name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds the package the way `cargo publish` would, which runs the build
  # scripts and proc macros of every dependency. The job therefore gets no
  # OIDC token and hands nothing to the publish job.
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Read the pin for the release assertion. The setup action installs the
      # toolchain directly from rust-toolchain.toml.
      - id: versions
        name: Read the pinned channel
        run: |
          pinned=$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$pinned" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "RUSTUP_TOOLCHAIN=$pinned" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
      - name: Verify the toolchain
        run: |
          active=$(rustup show active-toolchain)
          echo "$active"
          [[ $active == "${RUSTUP_TOOLCHAIN}-"* ]] \
            || { echo "active toolchain is not the pin ${RUSTUP_TOOLCHAIN}" >&2; exit 1; }

      - name: Check package
        run: cargo publish --dry-run --locked

  # Packs the same commit again and uploads it without compiling, so no
  # dependency code runs in the job that can request an OIDC token.
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false

      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth

      - run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
