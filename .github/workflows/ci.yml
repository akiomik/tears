name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Every job below names the toolchain it runs, and gets it from here rather
  # than restating it.
  #
  # Why the indirection: `dtolnay/rust-toolchain` selects a toolchain with
  # `rustup default` only, and rustup's precedence is a `+toolchain` argument >
  # `RUSTUP_TOOLCHAIN` > directory override > `rust-toolchain.toml` >
  # `rustup default`. So the pinned channel outranks whatever a job asks that
  # action for, and asking for `stable` while running the pin is the state this
  # indirection replaces: the toolchain the action installs is the one the
  # job's components are added to, while the pin is what builds, so a job that
  # named the wrong one installed its components somewhere it never built. It
  # could also move the `Swatinem/rust-cache` key, which hashes the version of
  # every installed toolchain and so picks up the action updating the one it
  # names — though not by making the key stop describing the build, since
  # `rustc -vV` runs in the workspace and so reports the pin either way.
  #
  # One consequence worth recording, because it stays silent until it bites:
  # the action installs with `--profile minimal`, and it is now installing the
  # pin itself. Before, the pin arrived by rustup auto-installing it from
  # `rust-toolchain.toml`, which carries `profile = "default"` and so brought
  # rustfmt, clippy and rust-docs along unasked. A job gets exactly what its
  # `components:` names now. Every job here asks for what it uses, but one
  # added later that runs, say, `just check` would fail on a component that
  # used to be present by accident.
  #
  # Reading these out of the files that declare them is what keeps a job
  # honest: the pin has one home (`rust-toolchain.toml`), the MSRV has one
  # home (`Cargo.toml`'s `rust-version`), and the feature set has one home
  # (the `justfile`), so bumping any of them moves CI with it instead of
  # leaving a job checking something nothing claims any more.
  #
  # `features` is what the jobs below enable instead of `--all-features`.
  # `--all-features` turns on `loom-core`, which *removes* code from the
  # build — `subscription::signal` is gated `cfg(not(all(feature =
  # "loom-core", test)))`.
  #
  # The `test` in that gate bounds what was lost, and it is narrower than it
  # looks: where `cfg(test)` is off the `all(..)` is false and the module is
  # kept, so `doc` documented it and the plain `--lib` unit of `--all-targets`
  # linted and MSRV-checked it throughout. What `--all-features` removed is
  # the module from *test-target* builds — so `test` never ran its three unit
  # tests, and `coverage` reported the module at 0% because the tests that
  # would have covered it were the ones removed.
  #
  # `build_features` is everything except `loom-core`, and the `justfile` is
  # the source because `just test-doc-packaged` fails when either list drifts
  # from the crate's own feature table.
  versions:
    name: Declared Versions
    runs-on: ubuntu-latest
    outputs:
      pinned: ${{ steps.read.outputs.pinned }}
      msrv: ${{ steps.read.outputs.msrv }}
      features: ${{ steps.read.outputs.features }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - id: read
        name: Read the pinned channel, the declared MSRV and the feature set
        run: |
          pinned=$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          msrv=$(sed -ne 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          features=$(just --evaluate build_features)
          # Each read needs a guard for the one empty result its command
          # reports as success: `sed` prints nothing and exits zero for a file
          # it can read that holds no matching line, and `just --evaluate`
          # exits zero for a variable that exists and evaluates empty. The
          # failures they do report need no guard — `sed` for a file it cannot
          # read, `just` for a name it does not know, both non-zero — because
          # this step has no `shell:`, so the default `bash -e` aborts at the
          # assignment before any guard runs. None of the three can fire
          # against the files as they stand; they are here for the edits that
          # would change that, and the `sed` guards are the likelier pair,
          # being tied to the layout of two files that get edited whenever
          # the pin or the MSRV moves.
          test -n "$pinned" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          test -n "$msrv" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          test -n "$features" || { echo "build_features is empty" >&2; exit 1; }
          {
            echo "pinned=$pinned"
            echo "msrv=$msrv"
            echo "features=$features"
          } >> "$GITHUB_OUTPUT"

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: versions
    # Deliberately the pinned channel rather than the newest stable: a lint
    # added after the pin would fail a contributor's pull request without
    # `just clippy` reproducing it, and this job's `-D warnings` is the one
    # place where that difference is a failure rather than a warning.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Run clippy
        run: just clippy
      # A second pass, because no single feature set sees the whole crate:
      # `loom-core` is the one feature that *removes* code, so the pass above
      # cannot lint `subscription::http::cell_core` and
      # `kernel::accounting_core` — 479 lines that `--all-features` used to
      # reach. Verified by putting a violation there: silent above, caught
      # here. Invoked via `just` so the local and CI invocations are
      # identical, as the bench and doctest jobs are, and so a red Clippy is
      # reproducible with `just clippy-loom`.
      - name: Run clippy over the loom mirrors
        run: just clippy-loom

  test:
    name: Test
    needs: versions
    strategy:
      # A leg that fails must not cancel its neighbours. Under the default
      # `fail-fast`, one failing leg cancels the rest of the matrix, and three
      # of these six are required contexts — so any single failure leaves a
      # merge blocked on checks that never ran and can therefore only ever
      # report `cancelled`.
      #
      # Whether that clears depends on why the leg failed, and both cases are
      # real. A transient failure clears on a re-run: that has happened here,
      # an `actions/checkout` fault on one runner cancelling the other five,
      # then a re-run turning all six green with nothing else changed. A
      # deterministic one does not — a `beta` leg tracking an upstream
      # regression fails the same way and cancels the same neighbours every
      # time, and the `beta` legs are not required, so they would be holding
      # up a merge they have no standing to block.
      #
      # The cost of not cancelling is the survivors' runtime: the six legs
      # total a median of 580s over the last 25 runs, so five of them running
      # on rather than being cancelled is most of that. It buys back a merge
      # that would otherwise be blocked on a tree with nothing wrong in it,
      # which is the better side of the trade.
      #
      # Runner *time*, not money — this repository is public, so GitHub-hosted
      # runners are free and its runs report zero billable milliseconds. What
      # is actually spent is occupancy and queue latency.
      #
      # `cancelled` blocks rather than passes, so the default was never
      # fail-open. This is a question of which failure costs less, not of
      # safety.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `pinned` is the channel a contributor's checkout selects, so this leg
        # is the one whose failures reproduce locally without asking anyone to
        # switch toolchains; `beta` is the leg that sees a regression before it
        # reaches a release. Calling the first one `stable` is what this
        # replaces — the pin outranked the action, so both legs ran the pin and
        # three of these six jobs repeated the other three.
        rust: [pinned, beta]
    runs-on: ${{ matrix.os }}
    # The leg's toolchain, named once and actually in force: `RUSTUP_TOOLCHAIN`
    # outranks `rust-toolchain.toml`, which is what makes the `beta` leg beta.
    # A directory override outranks the file too, but nothing here sets one.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust == 'pinned' && needs.versions.outputs.pinned || matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Verify the active toolchain
        shell: bash
        # A leg is only what it claims while that precedence holds, so this
        # turns a future change in it into a failure rather than into a leg
        # that quietly tests the same thing as its neighbour. Note what it can
        # and cannot catch: on the `beta` leg the two candidate answers differ,
        # so the check is the precedence claim itself; on the `pinned` leg
        # `RUSTUP_TOOLCHAIN` and `rust-toolchain.toml` carry the same string by
        # construction, so it passes whichever wins and is a consistency check
        # rather than evidence.
        #
        # A prefix comparison rather than `grep`, whose pattern would read the
        # dots in a version as any-character.
        run: |
          active=$(rustup show active-toolchain)
          echo "$active"
          [[ $active == "${RUSTUP_TOOLCHAIN}-"* ]]
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Run tests
        # Benches are excluded from this matrix (and run once, on Linux
        # only, in the `bench` job below) since the load harness's
        # (`kernel_load`) custom main ignores `cargo test`'s
        # `--test` flag and always runs its full scenarios; matrixing that
        # across every OS/toolchain makes Windows CI disproportionately slow
        # for no additional coverage.
        run: cargo test --lib --bins --tests --examples --features ${{ needs.versions.outputs.features }}
      # The mirrors' eight rows, which the set above cannot compile. They used
      # to run on every leg of this matrix under `--all-features`, and losing
      # that would move them from three required contexts to the `loom` job,
      # which is advisory and ubuntu-only — so a regression in them would stop
      # blocking a merge, and stop being seen off Linux at all.
      #
      # This is model checking too, not a plain threaded run: loom's runtime is
      # active whenever the mirrors compile, `--cfg loom` or not. The recipe
      # bounds it to the same preemption count the `loom` job uses. What it
      # adds over that job is the two things it cannot give — three platforms,
      # and a build *without* `--cfg loom`, which keeps the `cfg(not(loom))`
      # items compiled beside the mirrors.
      - name: Run the loom mirrors' rows
        run: just test-mirrors

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Run criterion benchmarks in test mode
        # `--bench <name>` (singular, per-target) rather than `--benches`
        # (plural): the plural form implicitly also runs the lib's unit
        # tests, duplicating what the `test` job's matrix already covers.
        # Criterion's own test mode is the smoke profile for it: one
        # iteration, no sample, so what it gates is that it still compiles
        # and runs.
        run: |
          cargo test --bench kernel_scan --features ${{ needs.versions.outputs.features }}
      - name: Run the load harness's smoke profiles
        # The full scenarios of the load harness leave CI: they are
        # deliberate acceptance/regression runs (RFC 0006 §5.1, RFC 0007
        # §5–6, RFC 0014 §13.5), and their latency numbers gate nothing on a
        # CI machine — a shortened row's percentiles are not the quantity the
        # acceptance matrices are stated over. CI runs only the reduced,
        # latency-assertion-free smoke profiles, which gate on completion and
        # sequence integrity. Invoked via `just` so the local and CI
        # invocations are identical (RFC 0007 §6).
        run: just bench-smoke

  loom:
    name: Loom
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      # `--cfg loom` reconfigures tokio (dropping modules like `signal`), so the
      # loom model checks are scoped to the `--lib` unit tests for the isolated
      # `cell_core` and `accounting_core` mirrors rather than the whole suite.
      # Invoked via `just` like the other stateful invocations here: the recipe
      # carries `RUSTFLAGS` and the preemption bound, and duplicating them
      # across two files is how they drift apart.
      - name: Run loom tests
        run: just test-loom

  api-surface:
    name: Public API Surface
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
      # `tests/api_surface.rs` shells out to `cargo +nightly rustdoc` itself
      # (rustdoc JSON output is nightly-only); this just makes that toolchain
      # available, it doesn't change what builds the test binary.
      - name: Install nightly toolchain for rustdoc JSON
        run: rustup toolchain install nightly
      - uses: Swatinem/rust-cache@v2
      # The test reads the feature set from `just --evaluate user_features`
      # rather than restating it, so `just` has to be on PATH here even though
      # this job runs no recipe.
      - uses: taiki-e/install-action@just
      - name: Check public API surface
        run: cargo test --test api_surface -- --ignored

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps --features ${{ needs.versions.outputs.features }}
        env:
          RUSTDOCFLAGS: -D warnings

  doctest:
    name: Doc Tests
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      # The `test` job passes explicit target flags, which suppress the
      # implicit doctest run; `doc` builds docs without `cfg(doctest)`, and
      # `coverage` omits `--doctests`. Without this job nothing compiles the
      # examples in rustdoc comments or in the `cfg(doctest)`-included
      # migration guide, so an API rename could break every snippet and leave
      # CI green. Invoked via `just` so the local and CI invocations are
      # identical, as the bench job above does.
      - name: Run doc tests
        run: just test-doc
      # Guards the `include` entry that keeps `include_str!` resolvable once
      # published; the recipe explains why nothing else catches it. Invoked
      # via `just` so the local and CI invocations are identical, and so the
      # feature list lives in one place rather than being restated here.
      - name: Run doc tests against the packaged crate
        run: just test-doc-packaged

  # The version installed is `Cargo.toml`'s `rust-version` rather than a number
  # written here, so the toolchain this checks and the claim it is checking
  # cannot come apart. The *name* is deliberately static and carries no
  # version: a check-run name is what a required-status-check rule matches on,
  # so deriving it from a file would let a `rust-version` bump rename the check
  # with no diff here — which is the same trap the `pinned` leg above avoids by
  # not being called `1.97.0`. The version is printed in the job instead.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: versions
    # Without this the pin outranks the toolchain installed below and this job
    # checks the pin, leaving `rust-version` asserted by nothing.
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.versions.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Verify the active toolchain
        run: |
          active=$(rustup show active-toolchain)
          echo "$active"
          [[ $active == "${RUSTUP_TOOLCHAIN}-"* ]]
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --all-targets --features ${{ needs.versions.outputs.features }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.pinned }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@just
      - name: Generate coverage
        run: just coverage-lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false
