[package]
name = "tears"
version = "0.10.2"
edition = "2024"
authors = ["Akiomi Kamakura <akiomik@gmail.com>"]
description = "A simple and elegant framework for building TUI applications using The Elm Architecture (TEA)"
documentation = "https://docs.rs/tears"
homepage = "https://github.com/akiomik/tears"
repository = "https://github.com/akiomik/tears"
license = "Apache-2.0"
readme = "README.md"
keywords = ["tui", "tea", "elm-architecture", "ratatui", "framework"]
categories = ["command-line-interface", "asynchronous"]
rust-version = "1.88.0"
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "benches/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[features]
default = []

http = ["dashmap", "thiserror"]
# Bench-only feature exposing internal-only subscription reconciliation hooks
# to `benches/subscription.rs`; do not enable for normal builds. Not part of
# the public API and not covered by semver.
bench-internals = []
# Test-only feature for the isolated loom cell core; do not enable for normal builds.
loom-core = ["dep:loom"]
ws = ["tokio-tungstenite/connect", "tokio-tungstenite/handshake"]
native-tls = ["tokio-tungstenite?/native-tls"]
rustls = ["dep:rustls", "tokio-tungstenite?/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["dep:rustls", "tokio-tungstenite?/rustls-tls-webpki-roots"]

[dependencies]
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["serde", "event-stream"] }
dashmap = { version = "6", default-features = false, optional = true }
futures = "0.3"
loom = { version = "0.7", optional = true }
ratatui = { version = "0.30", features = ["serde", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
thiserror = { version = "2", default-features = false, optional = true }
# `test-util` (not part of `full`) provides the paused virtual clock behind
# `tears::testing::TestStore`'s controlled time context; it is unconditional
# per RFC 0009 §5.1 (pausing is opt-in at runtime construction, so production
# behavior is unchanged — RFC 0009 INV-C4).
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, optional = true }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
criterion = "0.8"
# Used by the nightly-only `tests/api_surface.rs` structural check; see
# docs/testing.md "Public API Surface Tests". The re-export feature avoids a
# direct `rustdoc-types` dependency, so its version stays locked to whatever
# `public-api` itself requires instead of drifting independently.
public-api = { version = "0.52", features = ["experimental-feature-that-can-be-removed-in-a-patch-release_re-export-rustdoc-types"] }
# Exercises RFC 0003's pure keyed-command lifecycle state machine.
proptest = "1"
rustdoc-json = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by integration-test tracing helpers; integration tests compile as
# separate crates and should name their test-only dependencies directly.
tracing = "0.1"

[target.'cfg(not(loom))'.dev-dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[target.'cfg(unix)'.dev-dependencies]
# Peak-RSS measurement (`getrusage`) in `benches/runtime_load.rs`.
libc = "0.2"

[[bench]]
name = "subscription"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "runtime_load"
harness = false

[[bench]]
name = "gauge"
harness = false
required-features = ["bench-internals"]

# The kernel's load-acceptance re-derivation (RFC 0014 §13.5). Reaches the
# kernel through the `bench-internals` handles; `benches/runtime_load.rs` is
# the superseded topology's harness and stays as the before column.
[[bench]]
name = "kernel_load"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "kernel_scan"
harness = false
required-features = ["bench-internals"]

[[example]]
name = "websocket"
required-features = ["ws", "rustls"]

[[example]]
name = "http_todo"
required-features = ["http"]

[lints.rust]
missing_docs = "warn"
# `--cfg loom` is set by the CI loom job's RUSTFLAGS (not a Cargo feature),
# so `cfg(loom)` gates need declaring for the unexpected_cfgs lint.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
exit = "warn"
expect_used = "allow"
missing_assert_message = "warn"
mod_module_files = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "warn"
similar_names = "allow"
str_to_string = "warn"
string_add = "warn"
unwrap_used = "warn"
