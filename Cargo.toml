[package]
name = "tears"
version = "0.10.2"
edition = "2024"
authors = ["Akiomi Kamakura <akiomik@gmail.com>"]
description = "A simple and elegant framework for building TUI applications using The Elm Architecture (TEA)"
documentation = "https://docs.rs/tears"
homepage = "https://github.com/akiomik/tears"
repository = "https://github.com/akiomik/tears"
license = "Apache-2.0"
readme = "README.md"
keywords = ["tui", "tea", "elm-architecture", "ratatui", "framework"]
categories = ["command-line-interface", "asynchronous"]
rust-version = "1.88.0"
# Anchored with a leading slash: an include pattern without one is a
# gitignore-style glob that matches at any depth, so a bare "README.md"
# also swept `docs/rfcs/README.md` and `scripts/README.md` into the
# package. The four directory patterns already contain a slash and are
# anchored for that reason.
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "benches/**/*",
    # `src/lib.rs` pulls this guide in with `include_str!` under
    # `cfg(doctest)`. `cargo publish` verifies with `cargo build`, which drops
    # the item before the macro runs, so leaving it out breaks
    # `cargo test --doc` in the published crate and nowhere earlier; the
    # `doctest` job packages and extracts the crate to catch that.
    # Named file by file rather than `docs/migrations/**/*`, which would also
    # ship `docs/migrations/README.md` — a maintainer policy index, not crate
    # content.
    "/docs/migrations/0.10-to-0.11.md",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[features]
default = []

http = ["dashmap", "thiserror"]
# Bench-only feature exposing internal-only handles to the benches that need
# them, and to nothing else: the subscription reconciliation hooks
# (`benches/subscription.rs`), the load observer (`benches/gauge.rs`), and the
# kernel's driving and bookkeeping handles together with `Command::actions` —
# the only route to a producer-originated quit — for the load-acceptance and
# registry-scan harnesses (`benches/kernel_load.rs`, `benches/kernel_scan.rs`).
# Do not enable for normal builds. Not part of the public API and not covered
# by semver: every item it adds is `#[doc(hidden)]`, and a default build
# compiles none of them.
bench-internals = []
# Test-only feature for the isolated loom cell core; do not enable for normal builds.
loom-core = ["dep:loom"]
ws = ["tokio-tungstenite/connect", "tokio-tungstenite/handshake"]
native-tls = ["tokio-tungstenite?/native-tls"]
rustls = ["dep:rustls", "tokio-tungstenite?/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["dep:rustls", "tokio-tungstenite?/rustls-tls-webpki-roots"]

[dependencies]
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["serde", "event-stream"] }
dashmap = { version = "6", default-features = false, optional = true }
futures = "0.3"
loom = { version = "0.7", optional = true }
ratatui = { version = "0.30", features = ["serde", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
thiserror = { version = "2", default-features = false, optional = true }
# `test-util` (not part of `full`) provides the paused virtual clock behind
# `tears::testing::TestStore`'s controlled time context; it is unconditional
# per RFC 0009 §5.1 (pausing is opt-in at runtime construction, so production
# behavior is unchanged — RFC 0009 INV-C4).
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, optional = true }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
criterion = "0.8"
# Used by the nightly-only `tests/api_surface.rs` structural check; see
# docs/testing.md "Public API Surface Tests". The re-export feature avoids a
# direct `rustdoc-types` dependency, so its version stays locked to whatever
# `public-api` itself requires instead of drifting independently.
public-api = { version = "0.52", features = ["experimental-feature-that-can-be-removed-in-a-patch-release_re-export-rustdoc-types"] }
# Exercises RFC 0003's pure keyed-command lifecycle state machine.
proptest = "1"
rustdoc-json = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by integration-test tracing helpers; integration tests compile as
# separate crates and should name their test-only dependencies directly.
tracing = "0.1"

[target.'cfg(not(loom))'.dev-dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[target.'cfg(unix)'.dev-dependencies]
# Load-average sampling (`getloadavg`) in `benches/kernel_load.rs`.
libc = "0.2"

[[bench]]
name = "gauge"
harness = false
required-features = ["bench-internals"]

# The kernel's load-acceptance re-derivation (RFC 0014 §13.5). Reaches the
# kernel through the `bench-internals` handles. It is the only load harness:
# the superseded topology's harness went with the topology, and its numbers
# survive as the recorded before column in RFC 0006 §5.
[[bench]]
name = "kernel_load"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "kernel_scan"
harness = false
required-features = ["bench-internals"]

[[example]]
name = "websocket"
required-features = ["ws", "rustls"]

[[example]]
name = "http_todo"
required-features = ["http"]

[lints.rust]
missing_docs = "warn"
# `--cfg loom` is set by the CI loom job's RUSTFLAGS (not a Cargo feature),
# so `cfg(loom)` gates need declaring for the unexpected_cfgs lint.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
exit = "warn"
expect_used = "allow"
missing_assert_message = "warn"
mod_module_files = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "warn"
similar_names = "allow"
str_to_string = "warn"
string_add = "warn"
unwrap_used = "warn"
